<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AERO-SIM app icon</title>
  <desc id="desc">A cockpit-orange aircraft and telemetry symbol on a dark square.</desc>
  <defs>
    <linearGradient id="bg" x1="38" y1="25" x2="476" y2="503" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24150F"/>
      <stop offset="0.52" stop-color="#100F0E"/>
      <stop offset="1" stop-color="#070808"/>
    </linearGradient>
    <linearGradient id="accent" x1="158" y1="118" x2="365" y2="391" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD3A7"/>
      <stop offset="0.45" stop-color="#FF762F"/>
      <stop offset="1" stop-color="#C83C17"/>
    </linearGradient>
    <linearGradient id="plane" x1="256" y1="121" x2="256" y2="381" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2E7"/>
      <stop offset="1" stop-color="#C98B6B"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)" stroke="#6B4637" stroke-width="4"/>
  <path d="M256 79C354 79 433 158 433 256" stroke="url(#accent)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M79 256C79 158 158 79 256 79" stroke="#765344" stroke-width="6" stroke-linecap="round"/>
  <path d="M433 256C433 354 354 433 256 433" stroke="#765344" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 433C158 433 79 354 79 256" stroke="#FF762F" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18"/>
  <path d="M256 105V135M407 256H377M256 407V377M105 256H135" stroke="#D4A38A" stroke-width="7" stroke-linecap="round"/>
  <path d="M162 281L231 260L256 131L281 260L350 281L281 300L256 381L231 300L162 281Z" fill="url(#plane)"/>
  <path d="M256 131V381M162 281H350" stroke="#291613" stroke-width="9" stroke-linecap="round"/>
  <path d="M209 258L256 131L303 258" stroke="#FFF7F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="24" fill="#FF762F" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="9" fill="#FFF5EC"/>
